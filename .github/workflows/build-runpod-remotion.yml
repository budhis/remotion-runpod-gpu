name: Build & Push RunPod Remotion GPU Image

# Build image di runner GitHub (VM dengan Docker daemon ber-root), lalu push ke
# Docker Hub + GHCR. Build image OCI tidak bisa dilakukan di mesin kerja lokal
# (kernel memblokir pemetaan subuid) maupun di dalam pod RunPod (seccomp
# memblokir `unshare`).

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'render-gpu.sh'
      - 'docker-entrypoint.sh'
      - '.dockerignore'
      - '.github/workflows/build-runpod-remotion.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Custom tag untuk Docker image (default: latest)'
        required: false
        default: 'latest'

env:
  IMAGE_NAME: remotion-runpod-gpu

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Validasi file & izin eksekusi skrip
        run: |
          set -euo pipefail
          test -f Dockerfile
          test -f render-gpu.sh
          test -f docker-entrypoint.sh
          chmod +x render-gpu.sh docker-entrypoint.sh
          bash -n render-gpu.sh
          bash -n docker-entrypoint.sh
          echo "Semua skrip lolos bash -n"

      - name: 3. Bebaskan ruang disk GitHub Runner (image CUDA + Chromium besar)
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h /

      - name: 4. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 5. Login ke Docker Hub
        # Tanpa secret Docker Hub workflow tetap jalan; push-nya saja yang
        # dilewati (lihat langkah 8). GHCR selalu tersedia lewat GITHUB_TOKEN.
        id: dockerhub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DH_USER" ] || [ -z "$DH_TOKEN" ]; then
            echo "aktif=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN kosong — image hanya di-push ke GHCR"
            exit 0
          fi
          echo "aktif=true" >> "$GITHUB_OUTPUT"
          echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin

      - name: 6. Login ke GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 7. Generate metadata & tags otomatis
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.dockerhub.outputs.aktif == 'true' && format('{0}/{1}', secrets.DOCKERHUB_USERNAME, env.IMAGE_NAME) || '' }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.image_tag || 'latest' }}
            type=sha,prefix=sha-

      - name: 8. Build dan Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: 9. Uji isi image (build hijau != image bisa dipakai)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          IMG=$(printf '%s\n' "$TAGS" | head -1)
          echo "Menguji image: $IMG"
          docker run --rm --entrypoint bash "$IMG" -c '
            set -e
            node -v
            test -x /usr/local/bin/render-gpu && echo "render-gpu: ada"
            bash -n /usr/local/bin/render-gpu && echo "render-gpu: sintaks ok"
            test -d /usr/local/share/.remotion || test -d /opt/chrome/.remotion
            test -x /usr/local/bin/start.sh && echo "entrypoint: ada"
            test -x /usr/sbin/sshd && echo "sshd: ada"
            ls /root/.ssh/ssh_host_*_key >/dev/null && echo "host key: ada"
            cd /workspace/remotion-app
            node -e "require(\"remotion\"); require(\"@remotion/renderer\"); require(\"@remotion/three\"); require(\"three\"); console.log(\"paket remotion: ok\")"
          '

      - name: 10. Ringkasan Image yang Berhasil Di-publish
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          TAG: ${{ github.event.inputs.image_tag || 'latest' }}
        run: |
          {
            echo "### Image berhasil dibangun & diunggah"
            if [ -n "$DH_USER" ]; then
              echo "- **Docker Hub:** \`$DH_USER/$IMAGE_NAME:$TAG\`"
            else
              echo "- **Docker Hub:** dilewati (secret tidak diset)"
            fi
            echo "- **GHCR:** \`ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME:$TAG\`"
            echo "- **Digest:** lihat log langkah 8"
          } >> "$GITHUB_STEP_SUMMARY"
